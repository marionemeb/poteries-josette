services:
  php:
    build: docker/php
    volumes:
      - .:/var/www
    working_dir: /var/www
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: josette_test
      MYSQL_USER: josette
      MYSQL_PASSWORD: josette
    healthcheck:
      # --protocol=tcp matters: during its first-boot init, mysqld runs with
      # networking disabled and only a local ping would succeed, reporting
      # "healthy" before the server is actually reachable from other
      # containers (which always connect over TCP).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-u", "josette", "-pjosette"]
      interval: 2s
      timeout: 2s
      retries: 30
