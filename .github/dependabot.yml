version: 2
updates:
  # npm: should work normally now that package-lock.json's "resolved" URLs
  # point back at the public registry (see the project skill for the
  # incident where they briefly pointed at an unrelated private registry).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 21
    groups:
      # Babel packages only work in lockstep (a lone @babel/preset-react 8
      # with @babel/core 7 hung the build in 2026): one PR for all of them.
      babel:
        patterns: ["@babel/*"]
      # Encore and the webpack/Sass tooling it drives move together too.
      build-tools:
        patterns: ["@symfony/webpack-encore", "webpack", "webpack-cli", "sass", "sass-loader"]
    ignore:
      # A React major can remove APIs we call (18+ dropped ReactDOM.render(),
      # fixed by hand when moving to 19), and the CI build "passes" anyway:
      # webpack doesn't check this and no test runs the JS in a browser.
      # Majors are done by hand, with /recipes checked in a browser.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # composer: Symfony is pinned to 6.4.* (LTS) in composer.json, so PRs stay
  # within 6.4; moving to 7.x is a deliberate upgrade, not a Dependabot bump.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 21
    ignore:
      # Major versions of these are migrations of their own (EasyAdmin 5,
      # Doctrine ORM 3 both failed CI on 2026-09-24), done on purpose like
      # Symfony upgrades rather than through a Dependabot bump.
      - dependency-name: "easycorp/easyadmin-bundle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "doctrine/orm"
        update-types: ["version-update:semver-major"]

  # Keep the CI/deploy workflows' own action versions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 21
