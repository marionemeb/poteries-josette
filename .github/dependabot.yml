version: 2
updates:
  # npm: should work normally now that package-lock.json's "resolved" URLs
  # point back at the public registry (see the project skill for the
  # incident where they briefly pointed at an unrelated private registry).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 21
    ignore:
      # Major-bumped alone on 19/09/2026 and broke the build outright:
      # Encore 3.x needs Webpack 5 + a modern sass-loader/dart-sass + a
      # Node new enough for `??` syntax, none of which this project has.
      # Re-enable once node-sass/sass-loader/Node are modernized together.
      - dependency-name: "@symfony/webpack-encore"
        update-types: ["version-update:semver-major"]
      # react-dom alone would go to 19.x while `react` itself (not proposed
      # in the same PR) stays on 16.x — React requires matching majors, and
      # ReactDOM.render() (used in assets/js/index.js) was removed in 18+.
      # The CI build "passes" because webpack doesn't check this at all.
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # @babel/preset-react 8.x requires @babel/core ^8 (peer dep warning),
      # which this project doesn't have — the build hung reproducibly
      # partway through babel-loader when tested locally, despite CI
      # reporting green in isolation. Not trusted until @babel/core is
      # bumped in lockstep and this is re-verified.
      - dependency-name: "@babel/preset-react"
        update-types: ["version-update:semver-major"]

  # composer: Symfony is pinned to 6.4.* (LTS) in composer.json, so PRs stay
  # within 6.4; moving to 7.x is a deliberate upgrade, not a Dependabot bump.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 21

  # Keep the CI/deploy workflows' own action versions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 21
