name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env
        run: cp .env.dist .env

      - name: Build PHP image
        run: docker compose build php

      - name: Install dependencies
        run: docker compose run --rm php composer install --no-interaction --prefer-dist

      - name: Prepare test database schema
        run: docker compose run --rm -e APP_ENV=test php php bin/console doctrine:migrations:migrate --no-interaction

      - name: Check migrations match the entity mapping
        # Fails if an entity changed without a matching migration.
        run: docker compose run --rm -e APP_ENV=test php php bin/console doctrine:schema:validate

      - name: Download PHPUnit
        # symfony/phpunit-bridge's usual auto-download (vendor/bin/simple-phpunit)
        # relies on Composer 1, which Packagist stopped serving in Sept 2025 — see
        # the "Environnement de test" note in .claude/skills/poteries-josette.
        run: |
          mkdir -p .phpunit
          curl -sL -o .phpunit/phpunit.phar https://phar.phpunit.de/phpunit-7.5.20.phar

      - name: Run tests
        run: docker compose run --rm php php .phpunit/phpunit.phar

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '12'

      - name: Install Node dependencies
        run: |
          # Node 12 ships npm 6, which can't read our lockfileVersion 3
          # package-lock.json — upgrade npm first (still fine on Node 12).
          npm install -g npm@7
          npm ci

      - name: Build production assets
        # Catches exactly the kind of breakage the phpunit job above can't
        # see (e.g. the webpack-encore 3.x Dependabot PR that broke `npm run
        # build` outright while every PHP test still passed).
        run: npm run build

  php73-syntax-check:
    runs-on: ubuntu-latest
    # Our own PHP tooling (docker/php, this workflow's phpunit job) runs
    # PHP 7.4 for convenience, but OVH — and the deploy workflow, which
    # deliberately matches it — runs PHP 7.3. 7.4-only syntax (typed
    # properties, arrow functions used carelessly, etc.) parses fine in the
    # phpunit job and breaks only at deploy time. This lints src/ against
    # the real target version so that gap is caught here instead.
    steps:
      - uses: actions/checkout@v7

      - name: Lint src/ under PHP 7.3
        run: |
          docker run --rm -v "$PWD":/app php:7.3-cli \
            sh -c 'find /app/src -name "*.php" -exec php -l {} \;' \
            | tee /tmp/lint.log
          ! grep -q "Errors parsing" /tmp/lint.log
