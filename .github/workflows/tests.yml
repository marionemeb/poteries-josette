name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  phpunit:
    # Pinned rather than ubuntu-latest so a runner image change never lands
    # mid-deploy. (It used to be required by Node 12 / node-sass; Node now
    # comes from .nvmrc and no longer depends on the image.)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Prepare .env
        run: cp .env.dist .env

      - name: Build PHP image
        run: docker compose build php

      - name: Install dependencies
        run: docker compose run --rm php composer install --no-interaction --prefer-dist

      - name: Prepare test database schema
        run: docker compose run --rm -e APP_ENV=test php php bin/console doctrine:migrations:migrate --no-interaction

      - name: Check migrations match the entity mapping
        # Fails if an entity changed without a matching migration.
        run: docker compose run --rm -e APP_ENV=test php php bin/console doctrine:schema:validate

      - name: Run tests
        run: docker compose run --rm php vendor/bin/phpunit

  frontend-build:
    # Pinned, see the phpunit job above.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Same version as local development (.nvmrc).
          node-version-file: .nvmrc

      - name: Install Node dependencies
        run: npm ci

      - name: Build production assets
        # Catches exactly the kind of breakage the phpunit job above can't
        # see (e.g. the webpack-encore 3.x Dependabot PR that broke `npm run
        # build` outright while every PHP test still passed).
        run: npm run build

