name: Deploy to OVH

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_URL: https://www.poterie-josette.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, zip
          tools: composer:2

      - name: Install PHP dependencies (production)
        # APP_ENV=prod matters here, not just cosmetic: composer's post-install
        # scripts run cache:clear, which boots the kernel — with --no-dev, dev
        # bundles (WebProfilerBundle...) are gone from vendor/, so booting in
        # dev (the .env.dist default) fails with a ClassNotFoundError.
        run: APP_ENV=prod composer install --no-dev --optimize-autoloader --no-interaction

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '12'

      - name: Install Node dependencies
        run: |
          # Node 12 ships npm 6, which can't read our lockfileVersion 3
          # package-lock.json — upgrade npm first (still fine on Node 12).
          npm install -g npm@7
          npm ci

      - name: Build production assets
        # node-sass 4.x (used here) has no prebuilt binary past ~Node 13 —
        # Node 12 above is deliberate, not arbitrary, see the project skill.
        run: npm run build

      - name: Package the release
        # One zip instead of a file-by-file FTP sync: OVH's FTP server cuts
        # the connection after ~10k commands, which a vendor/ update easily
        # exceeds (two failed deploys on 2026-09-24). See deploy/release.php.
        run: deploy/package.sh release.zip

      - name: Prepare the one-shot deploy script
        # Random name and token for each run; the script deletes itself at
        # the end. If a run dies before that, the leftover is unusable
        # without this run's token.
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          script="deploy-$(openssl rand -hex 12).php"
          sed "s/__DEPLOY_TOKEN__/$token/" deploy/release.php > "$script"
          echo "DEPLOY_TOKEN=$token" >> "$GITHUB_ENV"
          echo "DEPLOY_SCRIPT=$script" >> "$GITHUB_ENV"

      - name: Upload over FTP
        env:
          FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          FTP_USER: ${{ secrets.OVH_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.OVH_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.OVH_FTP_REMOTE_DIR }}
        run: |
          dir=${FTP_DIR#./}; dir=${dir#/}; dir=${dir%/}
          [ -n "$dir" ] || { echo "OVH_FTP_REMOTE_DIR is empty"; exit 1; }
          upload() { curl --fail --silent --show-error --ssl --retry 3 --user "$FTP_USER:$FTP_PASS" -T "$1" "ftp://$FTP_HOST/$2"; }
          # The zip goes to the FTP home, above the app directory, where
          # nothing is served over HTTP.
          upload release.zip release.zip
          upload "$DEPLOY_SCRIPT" "$dir/public/$DEPLOY_SCRIPT"

      - name: Unpack on the server
        run: |
          step() { curl --fail-with-body --silent --show-error --max-time 600 -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "$SITE_URL/$DEPLOY_SCRIPT?step=$1"; }
          step check | tee check.json
          jq -e '.zip and .home_writable and .www_writable and .release_zip > 0' check.json > /dev/null
          step extract

      - name: Switch to the new release
        id: swap
        run: |
          curl --fail-with-body --silent --show-error --max-time 600 -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "$SITE_URL/$DEPLOY_SCRIPT?step=swap"

      - name: Check the live site
        run: |
          sleep 5
          status=0
          for path in / /articles /recipes /login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 10 "$SITE_URL$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || status=1
          done
          exit $status

      - name: Roll back
        # Only once the new release is live; a failed swap already put the
        # old one back by itself.
        if: failure() && steps.swap.outcome == 'success'
        run: |
          curl --fail-with-body --silent --show-error --max-time 600 -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "$SITE_URL/$DEPLOY_SCRIPT?step=rollback"

      - name: Clean up
        # Deletes the script and the zip; the previous release stays as
        # www_prev until the next deploy, for a manual rollback.
        run: |
          curl --fail-with-body --silent --show-error --max-time 600 -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "$SITE_URL/$DEPLOY_SCRIPT?step=finish"
