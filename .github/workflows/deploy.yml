name: Deploy to OVH

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          tools: composer:1

      - name: Install PHP dependencies (production)
        # APP_ENV=prod matters here, not just cosmetic: composer's post-install
        # scripts run cache:clear, which boots the kernel — with --no-dev, dev
        # bundles (WebProfilerBundle...) are gone from vendor/, so booting in
        # dev (the .env.dist default) fails with a ClassNotFoundError.
        run: APP_ENV=prod composer install --no-dev --optimize-autoloader --no-interaction

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '12'

      - name: Install Node dependencies
        run: |
          # Node 12 ships npm 6, which can't read our lockfileVersion 3
          # package-lock.json — upgrade npm first (still fine on Node 12).
          npm install -g npm@7
          npm ci

      - name: Build production assets
        # node-sass 4.x (used here) has no prebuilt binary past ~Node 13 —
        # Node 12 above is deliberate, not arbitrary, see the project skill.
        run: npm run build

      - name: Deploy over FTP
        # Symfony in prod does NOT auto-invalidate its compiled container
        # when source files change — it just keeps using whatever's already
        # in var/cache/prod on the server. Excluding var/** entirely (as a
        # previous version of this workflow did) meant every deploy after
        # the very first left a stale, out-of-date compiled container in
        # place — code changes shipped over FTP but never actually took
        # effect, and could throw fatal errors once the mismatch got bad
        # enough (this broke production on 19/09/2026). So the compiled
        # cache (container, routes, twig, ~300 small files) DOES need to
        # ship every time. What must still be excluded is only
        # var/cache/**/pools/** — Symfony's filesystem cache pools, which
        # pre-create tens of thousands of near-empty directories regardless
        # of actual cached item count, and uploading that one-by-one over
        # FTP is what made an earlier run take 2+ hours. var/log/** is
        # excluded too, so this deploy never overwrites the server's real
        # error log with an empty one from the build machine.
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.OVH_FTP_HOST }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          server-dir: ${{ secrets.OVH_FTP_REMOTE_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/docker/**
            docker-compose.yml
            .env
            .env.dist
            .env.test
            .envrc
            .phpunit/**
            var/cache/**/pools/**
            var/log/**
